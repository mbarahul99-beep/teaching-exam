<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>OMR Answer Sheet - Print View</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800;900&display=swap');
        body {
            margin: 0;
            padding: 0;
            background-color: #f1f5f9;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .toolbar {
            width: 100%;
            max-width: 210mm;
            background-color: #fff;
            padding: 12px 24px;
            box-sizing: border-box;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-radius: 0 0 12px 12px;
        }
        .toolbar h2 {
            margin: 0;
            font-size: 16px;
            color: #0f172a;
            font-family: 'Outfit', sans-serif;
        }
        .print-btn {
            background-color: #dc0045;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 4px rgba(220,0,69,0.25);
            font-family: 'Outfit', sans-serif;
        }
        .print-btn:hover {
            background-color: #b50039;
        }
        .page-container {
            width: 210mm;
            height: 297mm;
            background-color: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            position: relative;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        @media print {
            body {
                background: none;
                padding: 0;
                margin: 0;
            }
            .toolbar {
                display: none;
            }
            .page-container {
                box-shadow: none;
                margin: 0;
                width: 210mm;
                height: 297mm;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>
    <div class="toolbar">
        <h2>Bubble OMR Print Utility</h2>
        <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
    </div>

    <div class="page-container" id="omr-container">
        <!-- SVG content will be injected here -->
    </div>

    <script>
        // Parse parameters
        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get("title") || "Mock Examination";
        const qCount = parseInt(urlParams.get("qCount")) || 180;

        // Constants from OMR_CONFIG (omrScanner.js)
        const anchors = {
            tl: { x: 70, y: 70 },
            tr: { x: 930, y: 70 },
            bl: { x: 70, y: 1344 },
            br: { x: 930, y: 1344 }
        };

        const studentId = {
            xStart: 100,
            xStep: 36,
            yStart: 205,
            yStep: 18,
            numDigits: 3
        };

        const bookletSet = {
            xStart: 265,
            xStep: 30,
            yStart: 195
        };

        const questions = {
            columns: [
                { qStart: 1, qEnd: 40, xLabel: 90, xOptions: [120, 145, 170, 195], yStart: 460 },
                { qStart: 41, qEnd: 80, xLabel: 260, xOptions: [290, 315, 340, 365], yStart: 460 },
                { qStart: 81, qEnd: 120, xLabel: 430, xOptions: [460, 485, 510, 535], yStart: 460 },
                { qStart: 121, qEnd: 160, xLabel: 600, xOptions: [630, 655, 680, 705], yStart: 460 },
                { qStart: 161, qEnd: 200, xLabel: 770, xOptions: [800, 825, 850, 875], yStart: 460 }
            ]
        };

        // Build SVG Document in the OMR-Theme color (#dc0045)
        let svg = `<svg viewBox="0 0 1000 1414" xmlns="http://www.w3.org/2000/svg">
            <!-- 4 Corner Black Squares Anchors (36x36px centered on anchors coordinates) -->
            <rect x="${anchors.tl.x - 18}" y="${anchors.tl.y - 18}" width="36" height="36" fill="black" />
            <rect x="${anchors.tr.x - 18}" y="${anchors.tr.y - 18}" width="36" height="36" fill="black" />
            <rect x="${anchors.bl.x - 18}" y="${anchors.bl.y - 18}" width="36" height="36" fill="black" />
            <rect x="${anchors.br.x - 18}" y="${anchors.br.y - 18}" width="36" height="36" fill="black" />

            <!-- Outer Margin Frame (Styled in signature #dc0045) -->
            <rect x="70" y="75" width="860" height="1240" fill="none" stroke="#dc0045" stroke-width="1.5" />

            <!-- Institution Brand Header -->
            <text x="500" y="62" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="22" font-weight="900" fill="#dc0045" letter-spacing="1">INSTITUTE APEX</text>
            <text x="500" y="78" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9.5" font-weight="800" fill="#dc0045" letter-spacing="0.5">OFFICIAL BUBBLE SHEET</text>
            <text x="500" y="108" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" fill="#0f172a">CLASS: NEET &nbsp;|&nbsp; TEST: ${title.toUpperCase()}</text>

            <!-- Decorative Border Cards (Boxes) with Crimson Header and stroke -->
            <!-- 1. ROLL NUMBER BOX -->
            <rect x="70" y="130" width="150" height="260" fill="none" stroke="#dc0045" stroke-width="1.2" rx="4" />
            <rect x="70" y="130" width="150" height="22" fill="#dc0045" stroke="#dc0045" stroke-width="1.2" clip-path="inset(0 0 1px 0)" />
            <text x="145" y="145" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">ROLL NUMBER</text>

            <!-- 2. BOOKLET SET BOX -->
            <rect x="235" y="130" width="150" height="100" fill="none" stroke="#dc0045" stroke-width="1.2" rx="4" />
            <rect x="235" y="130" width="150" height="22" fill="#dc0045" stroke="#dc0045" stroke-width="1.2" clip-path="inset(0 0 1px 0)" />
            <text x="310" y="145" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">BOOKLET SET</text>

            <!-- 3. SCANNING INSTRUCTIONS BOX -->
            <rect x="235" y="245" width="695" height="145" fill="none" stroke="#dc0045" stroke-width="1.2" rx="4" />
            <rect x="235" y="245" width="695" height="22" fill="#dc0045" stroke="#dc0045" stroke-width="1.2" clip-path="inset(0 0 1px 0)" />
            <text x="582" y="260" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">IMPORTANT SCANNING RULES</text>

            <!-- 4. SIGNATURE BOX -->
            <rect x="400" y="130" width="530" height="100" fill="none" stroke="#dc0045" stroke-width="1.2" rx="4" />
            <rect x="400" y="130" width="530" height="22" fill="#dc0045" stroke="#dc0045" stroke-width="1.2" clip-path="inset(0 0 1px 0)" />
            <text x="665" y="145" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">CANDIDATE SIGNATURE</text>
            <text x="665" y="190" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9" fill="#94a3b8">Sign inside this box in running hand before starting</text>

            <!-- Instructions bullets -->
            <g font-family="'Outfit', sans-serif" font-size="8.5" font-weight="700" fill="#dc0045">
                <circle cx="260" cy="290" r="2.5" fill="#dc0045" />
                <text x="272" y="293">Use blue or black ballpoint pen to fill bubbles completely.</text>
                
                <circle cx="260" cy="315" r="2.5" fill="#dc0045" />
                <text x="272" y="318">Do not fold, tear, wrinkle, or smudge this printed paper sheet.</text>
                
                <circle cx="260" cy="340" r="2.5" fill="#dc0045" />
                <text x="272" y="343">Keep the four black corner squares completely visible and free of shadows.</text>
                
                <circle cx="260" cy="365" r="2.5" fill="#dc0045" />
                <text x="272" y="368">Scan flat on a level background using the app camera scanner.</text>
            </g>
        `;

        // Generate Roll Number digit input boxes and bubbles in Crimson OMR Theme
        for (let col = 0; col < studentId.numDigits; col++) {
            const x = studentId.xStart + col * studentId.xStep;
            // Draw input box
            svg += `<rect x="${x - 12}" y="162" width="24" height="20" fill="none" stroke="#dc0045" stroke-width="1" />`;
            
            // Draw bubbles for digits 1 to 9, then 0
            const digits = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0];
            digits.forEach((digit, idx) => {
                const y = studentId.yStart + idx * studentId.yStep;
                svg += `
                    <circle cx="${x}" cy="${y}" r="6.8" stroke="#dc0045" stroke-width="0.9" fill="none" />
                    <text x="${x}" y="${y + 2.5}" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="900" fill="rgba(220,0,69,0.3)">${digit}</text>
                `;
            });
        }

        // Generate Booklet Set bubbles (A, B, C, D)
        const sets = ["A", "B", "C", "D"];
        sets.forEach((set, idx) => {
            const x = bookletSet.xStart + idx * bookletSet.xStep;
            const y = bookletSet.yStart;
            svg += `
                <circle cx="${x}" cy="${y}" r="8" stroke="#dc0045" stroke-width="0.9" fill="none" />
                <text x="${x}" y="${y + 3}" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="9.5" font-weight="900" fill="rgba(220,0,69,0.35)">${set}</text>
            `;
        });

        // Generate Questions Option Grid (up to qCount)
        const options = ["A", "B", "C", "D"];
        questions.columns.forEach(col => {
            // Draw column header labels
            if (col.qStart <= qCount) {
                const headY = col.yStart - 20;
                svg += `<text x="${col.xLabel}" y="${headY + 3}" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7.5" font-weight="900" fill="#dc0045">Q.No</text>`;
                options.forEach((opt, oIdx) => {
                    svg += `<text x="${col.xOptions[oIdx]}" y="${headY + 3}" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8.5" font-weight="900" fill="#dc0045">${opt}</text>`;
                });
            }

            for (let q = col.qStart; q <= col.qEnd; q++) {
                if (q > qCount) break;

                const y = col.yStart + (q - col.qStart) * 19; // yStep = 19
                
                // Draw Q Number label (rendered in bold black for clear OCR segmentation contrast)
                svg += `<text x="${col.xLabel}" y="${y + 3}" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="8" font-weight="900" fill="#000000">${String(q).padStart(3, '0')}</text>`;

                // Draw option bubbles A, B, C, D in Crimson Red with translucent lettering
                options.forEach((opt, idx) => {
                    const cx = col.xOptions[idx];
                    svg += `
                        <circle cx="${cx}" cy="${y}" r="5.8" stroke="#dc0045" stroke-width="0.8" fill="none" />
                        <text x="${cx}" y="${y + 2.5}" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="7" font-weight="900" fill="rgba(220,0,69,0.3)">${opt}</text>
                    `;
                });
            }
        });

        // Bottom disclaimer
        svg += `<text x="500" y="1332" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="6.5" font-weight="800" fill="#dc0045">DO NOT BEND OR WRINKLE THIS SHEET. COMPUTER GRADING ALIGNMENT MARKS MUST REMAIN CLEAN AND DISCOLORATION FREE.</text>`;

        svg += `</svg>`;
        document.getElementById("omr-container").innerHTML = svg;
    </script>
</body>
</html>
